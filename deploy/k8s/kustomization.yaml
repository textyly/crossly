apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Crossly UI (slice S0). Render with `kubectl kustomize deploy/k8s` and
# deploy with `kubectl apply -k deploy/k8s`.
#
# The namespace is not created here, so that whoever runs the cluster can attach
# quotas and network policies to it. Create it first.
namespace: crossly

resources:
  - ui-deployment.yaml
  - ui-service.yaml
  - ui-ingress.yaml

# The tag is only a known-good default. Override it with your own images: in an
# overlay, or let image automation (Flux) keep it current.
images:
  - name: ghcr.io/textyly/crossly-ui
    newTag: main-8064a8b-1793537585
