apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crossly
  labels:
    app.kubernetes.io/name: crossly
    app.kubernetes.io/part-of: crossly
spec:
  # No ingressClassName: the cluster's default ingress class handles this.
  rules:
    # A valid default that resolves to your own machine, handy for a local
    # trial. Replace it with your public hostname (for example with a patch in
    # an overlay).
    - host: crossly.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crossly-ui
                port:
                  name: http
